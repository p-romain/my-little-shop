controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app.swagger:
    path: /doc.json
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.swagger

app.swagger_ui:
    path: /doc
    methods: GET
    defaults:
        _controller: nelmio_api_doc.controller.swagger_ui

api_login_check:
    path: /api/login
    methods: POST
